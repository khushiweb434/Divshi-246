<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday My Love ❤️</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
/* EXTRA BEAUTY ADDED */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(120deg, #ffdde1, #ee9ca7);
    overflow-x: hidden;
}

.hearts span {
    position: absolute;
    animation: float 6s infinite ease-in-out;
    font-size: 24px;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

/* BUTTON */
button {
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ff2e63;
}

/* POPUP SURPRISE */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.popup-content {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 80%;
    max-width: 400px;
    animation: pop 0.5s ease;
}

@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.close {
    float: right;
    cursor: pointer;
    font-size: 22px;
}
</style>

</head>

<body>

<!-- FLOATING HEARTS -->
<div class="hearts">
<span>❤️</span>
<span>💖</span>
<span>💕</span>
<span>💘</span>
<span>💝</span>
</div>

<!-- FIRST PAGE -->
<section class="hero">

<h1>Happy Birthday My Love ❤️</h1>

<p>Happpiiieeeessssttttt Birthdayyyy Jaaannnn ✨</p>

<button onclick="openSurprise()">Open Surprise 🎁</button>

</section>

<!-- POPUP SURPRISE -->
<div class="popup" id="popup">
<div class="popup-content">

<span class="close" onclick="closeSurprise()">❌</span>

<h2>🎉 Surpriseee Jaan ❤️</h2>

<p>
You are the most special person in my life 💖<br>
I just want to say... I LOVE YOU SO MUCH ❤️
</p>

<button onclick="secondSurprise()">Another Surprise 💝</button>

</div>
</div>

<!-- SECOND SURPRISE -->
<div class="popup" id="popup2">
<div class="popup-content">

<span class="close" onclick="closeSecond()">❌</span>

<h2>💖 One More Thing...</h2>

<p>
You are my happiness,<br>
my peace,<br>
and my forever ❤️✨
</p>

</div>
</div>

<!-- AUDIO -->
<audio autoplay loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<script>
function openSurprise() {
    document.getElementById("popup").style.display = "flex";
    createConfetti();
}

function closeSurprise() {
    document.getElementById("popup").style.display = "none";
}

function secondSurprise() {
    document.getElementById("popup2").style.display = "flex";
}

function closeSecond() {
    document.getElementById("popup2").style.display = "none";
}

/* SIMPLE CONFETTI */
function createConfetti() {
    for (let i = 0; i < 50; i++) {
        let confetti = document.createElement("div");
        confetti.innerHTML = "🎉";
        confetti.style.position = "fixed";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.fontSize = "20px";
        confetti.style.animation = "fall 3s linear";
        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 3000);
    }
}

/* CONFETTI FALL */
let style = document.createElement('style');
style.innerHTML = `
@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}`;
document.head.appendChild(style);
</script>

</body>
</html>
